<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="utf-8" />
  <title>HydroFlow — Thank you</title>
  <style>
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("plus-jakarta-sans-400.woff2") format("woff2");
    }
    @font-face {
      font-family: "Plus Jakarta Sans";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("plus-jakarta-sans-600.woff2") format("woff2");
    }
    :root {
      --hf-midnight: oklch(0.198 0.035 254.7);
      --hf-mist: oklch(0.97 0.011 243.7);
      --hf-cyan: oklch(0.741 0.12 214.6);
      --muted: oklch(0.76 0.03 242);
      --gradient-welcome:
        radial-gradient(ellipse 70% 55% at 50% 42%, oklch(0.274 0.04 240.1 / 90%), transparent 70%),
        linear-gradient(180deg, var(--hf-midnight), oklch(0.17 0.03 250));
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: var(--hf-midnight);
      font-family: "Plus Jakarta Sans", "Myanmar Text", sans-serif;
      color: var(--hf-mist);
    }
    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--gradient-welcome);
    }
    .ripples {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-radial-gradient(
          circle at 50% 46%,
          transparent 0 70px,
          oklch(0.741 0.12 214.6 / 4%) 71px 72px
        );
      mask-image: radial-gradient(ellipse 60% 50% at 50% 46%, black, transparent 75%);
    }
    .corner-logo {
      position: absolute;
      top: 32px;
      z-index: 2;
      height: 84px;
      width: auto;
      border-radius: 6px;
      background: var(--hf-mist);
      padding: 4px;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.25), 0 4px 6px -4px rgb(0 0 0 / 0.25);
      animation: rise 800ms cubic-bezier(0.22, 1, 0.36, 1) 200ms both;
    }
    .corner-logo--left { left: 36px; }
    .corner-logo--right { right: 36px; animation-delay: 350ms; }
    .card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      animation: rise 800ms cubic-bezier(0.22, 1, 0.36, 1) 150ms both;
    }
    .thanks-en {
      margin: 0;
      color: var(--hf-cyan);
      font-size: 86px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    .thanks-my {
      margin: 14px 0 0;
      font-family: "Myanmar Text", "Pyidaungsu", sans-serif;
      font-size: 36px;
      font-weight: 600;
      line-height: 1.3;
    }
    .rule {
      width: 148px;
      height: 4px;
      margin: 28px 0 0;
      border-radius: 4px;
      background: var(--hf-cyan);
    }
    .name {
      margin: 64px 0 0;
      font-size: 64px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }
    .name span { color: var(--hf-cyan); }
    .group {
      margin: 22px 0 0;
      border-radius: 999px;
      border: 1px solid color-mix(in oklab, var(--hf-cyan) 40%, transparent);
      padding: 8px 22px;
      color: var(--hf-cyan);
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.35em;
      text-transform: uppercase;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: none; }
    }
    .stage, .stage * { animation-play-state: paused !important; }
  </style>
</head>
<body>
  <main class="stage">
    <div class="ripples" aria-hidden="true"></div>
    <img class="corner-logo corner-logo--left" src="uit-logo.png" alt="UIT logo" />
    <img class="corner-logo corner-logo--right" src="imceits-logo.png" alt="IMCEITS logo" />
    <div class="card">
      <p class="thanks-en">Thank you</p>
      <h1 class="thanks-my">ကျေးဇူးတင်ပါသည်</h1>
      <div class="rule" aria-hidden="true"></div>
      <p class="name">Hydro<span>Flow</span></p>
      <p class="group">Group 5</p>
    </div>
  </main>
</body>
</html>
